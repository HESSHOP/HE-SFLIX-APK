<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HESFLIX</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 16px;font:600 14px sans-serif}
</style></head>
<body>
<video id="v" playsinline webkit-playsinline preload="auto" src="hesflix-intro.mp4"></video>
<button id="skip" type="button">Passer</button>
<script>
var SITE="https://hesflix.vercel.app/",done=false;
function go(){if(done)return;done=true;location.replace(SITE)}
/* pas de connexion : écran "Problème de connexion" tout de suite */
if(navigator.onLine===false){done=true;location.replace("offline.html")}
else{
 var v=document.getElementById("v");
 v.addEventListener("ended",go);v.addEventListener("error",go);
 document.getElementById("skip").onclick=go;
 var p=v.play();
 if(p&&p.catch)p.catch(function(){v.muted=true;var q=v.play();if(q&&q.catch)q.catch(go)});
 setTimeout(go,15000);
}
</script></body></html>
